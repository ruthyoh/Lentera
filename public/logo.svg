<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Lentera TCC">
  <!-- Lentera / Lantern shape -->
  <rect x="14" y="6" width="12" height="2" rx="1" fill="#2D5016"/>
  <rect x="18" y="4" width="4" height="4" rx="1" fill="#2D5016"/>
  <!-- Lantern body -->
  <rect x="10" y="8" width="20" height="22" rx="4" fill="#2D5016"/>
  <!-- Light glow inside -->
  <rect x="13" y="11" width="14" height="16" rx="2" fill="#F5F0E8" opacity="0.9"/>
  <!-- Flame -->
  <ellipse cx="20" cy="16" rx="3" ry="4" fill="#C4622D"/>
  <ellipse cx="20" cy="17" rx="2" ry="2.5" fill="#E8A87C"/>
  <!-- Bottom cap -->
  <rect x="12" y="30" width="16" height="3" rx="1.5" fill="#2D5016"/>
  <!-- Vertical bars on lantern -->
  <rect x="16" y="8" width="1.5" height="22" rx="0.75" fill="#1A3A0A" opacity="0.3"/>
  <rect x="22.5" y="8" width="1.5" height="22" rx="0.75" fill="#1A3A0A" opacity="0.3"/>
  <!-- Bottom hook -->
  <rect x="18" y="33" width="4" height="2" rx="1" fill="#2D5016"/>
</svg>
